const D=[
{n:'Intro · 씨앗의 세계',k:'본문 1번',q:[
m('내용일치','본문 1번과 일치하는 것은?',['식물은 최근에야 생존 전략을 만들었다.','씨앗은 식물이 개발한 강력한 생존 기술 중 하나다.','식물은 한 가지 생존 전략만 가졌다.','씨앗은 가장 약한 생존 수단이다.'],1,'“Seeds … are one of the strongest survival techniques”. ①은 long existence, ③은 diverse strategies와 어긋납니다.'),
m('빈칸','Throughout their long existence, they have created ____ survival strategies.',['diverse','single','weak','similar'],0,'“다양한 생존 전략”이므로 diverse(다양한)가 알맞습니다.'),
m('어법','Seeds are one of the strongest survival techniques they ____ developed.',['has','have','having','are'],1,'주어 they + 현재완료(have p.p.) 형태이므로 have.'),
s('빈칸(서술)','Let’s ____ the fascinating and mysterious world of seeds. (발견하다, d로 시작)',['discover'],'“알아봅시다”의 의미로 discover가 쓰였습니다. Let’s + 동사원형.')]},
{n:'Help Yourself and Help Me',k:'본문 2번 · Jackfruit',q:[
m('제목','본문 2번의 제목으로 가장 알맞은 것은?',['Jackfruit: Food in Exchange for Seed Spreading','How Animals Digest Fruit','The Sweet Smell of Pineapples','Why Plants Fear Animals'],0,'식물은 먹이를 주고 동물은 씨앗을 퍼뜨리는 상호 이익이 핵심입니다.'),
m('내용일치','Jackfruit에 대한 설명으로 일치하지 않는 것은?',['세계에서 가장 큰 나무 열매이다.','달콤한 향으로 동물을 끌어들인다.','씨앗은 동물의 소화관에서 소화된다.','동물이 배변하면 씨앗이 발아한다.'],2,'씨앗은 “not digested and pass through … untouched”. 소화되는 것은 과육뿐입니다.'),
m('빈칸','In ____ for a satisfying meal, the animals spread the jackfruit seeds.',['exchange','spite','charge','addition'],0,'in exchange for ~ = ~의 대가로.'),
s('빈칸(서술)','They offer tasty food to animals in ____ for distributing their seeds. (대가로, r로 시작)',['return'],'in return for ~ = ~에 대한 보답으로. distributing은 spreading과 같은 뜻입니다.')]},
{n:'The Worst Free Rider',k:'본문 3번 · Devil’s claw',q:[
m('제목','본문 3번의 제목으로 알맞은 것은?',['Devil’s Claw: The Worst Free Rider','Sweet Fruits for Animals','Life in the Kalahari Desert','Pink Trumpets of Africa'],0,'보답 없이 동물에게 씨앗을 붙여 퍼뜨리는 식물이므로 free rider가 핵심입니다.'),
m('내용일치','Devil’s claw에 대한 설명으로 일치하는 것은?',['달콤한 과일로 동물을 유혹한다.','열매가 마르면 갈고리가 단단해진다.','북극 지방에 주로 산다.','꽃은 노란색 종 모양이다.'],1,'“As these fruits dry, … their hooks become tough”. 서식지는 칼라하리 사막, 꽃은 분홍색 트럼펫 모양입니다.'),
m('내용이해','Devil’s claw가 최악의 무임승차자라고 불리는 이유는?',['보상 없이 동물에게 고통을 주며 씨앗을 퍼뜨려서','다른 식물의 씨앗을 훔쳐서','열매의 과육에 독이 있어서','사막의 물을 독점해서'],0,'먹이를 주지 않고(without any return benefit) 갈고리로 심한 통증을 줍니다.'),
s('대동사(서술형)','“Many plants opt to scatter their seeds by providing food to animals, but not all of them ____.” 빈칸에 알맞은 대동사를 쓰시오.',['do'],'do는 앞의 일반동사구 opt to scatter ... animals를 대신하는 대동사입니다.'),
m('대동사','위 문장의 do가 대신하는 것은?',['opt to scatter their seeds by providing food to animals','attach their seeds to animals','live in the Kalahari Desert','become known as free riders'],0,'but not all of them do = 모든 식물이 그렇게 하는(먹이를 제공해 씨앗을 퍼뜨리기로 선택하는) 것은 아니다.')]},
{n:'Deceptive Seeds',k:'본문 4번 · Silver arrow-reed',q:[
m('내용일치','Silver arrow-reed에 대한 설명으로 일치하는 것은?',['쇠똥구리를 속여 씨앗을 퍼뜨린다.','씨앗이 1 cm보다 훨씬 크다.','쇠똥구리가 씨앗 안에 알을 낳는다.','영양이 씨앗을 먹는다.'],0,'씨앗은 1 cm보다 “약간” 크며, 쇠똥구리는 먹거나 알을 낳지 못하고 포기합니다.'),
m('빈칸','Silver arrow-reed spreads its seeds by ____ dung beetles.',['deceiving','feeding','chasing','helping'],0,'씨앗이 배설물처럼 보이게 하여 속이는(deceive) 방법입니다.'),
m('빈칸','They have no choice but to ____ and search for real dung balls.',['abort','continue','celebrate','bury'],0,'have no choice but to ~ = ~할 수밖에 없다. 먹을 수 없음을 알고 포기(abort)합니다.'),
s('생략된 부분(서술형)','“Dung beetles ... roll antelope dung and bury it in the ground to eat or lay eggs in.” 마지막 전치사 in 뒤에 생략된 목적어를 쓰시오. (1단어)',['it'],'lay eggs in it(= antelope dung)에서 앞에 나온 it과 같아 생략되었습니다.'),
m('생략','“... the confused beetles will realize they cannot.” cannot 뒤에 생략된 내용은?',['eat the seeds or lay eggs inside of them','roll the seed away','find real dung','see the seed'],0,'앞 문장의 try to eat the seeds or lay eggs inside of them이 반복되어 생략되었습니다.')]},
{n:'The Wind Beneath My Wings',k:'본문 5번 · Maple',q:[
m('내용일치','단풍나무 씨앗에 대한 설명으로 일치하는 것은?',['회전하며 떨어져 더 오래, 더 멀리 날아간다.','회전하지 않을수록 더 높이 올라간다.','동물의 털에 붙어 이동한다.','낙하 속도가 빨라져 손상이 적다.'],0,'회전은 체공 시간을 늘리고 낙하 속도를 늦춰 손상을 줄입니다.'),
s('배수 표현','“... elevate twice as ____ as non-rotating seeds.” (높이, h로 시작)',['high'],'배수 + as + 원급 + as: twice as high as (~의 두 배 높이로).'),
m('배수 표현','twice as high as와 같은 의미는?',['twice the height of','half the height of','twice lower than','two as high than'],0,'배수 + as 원급 as = 배수 + the 명사 of.'),
m('어법','This rotation makes the seed ____ in the air longer and fly farther.',['stay','to stay','staying','stays'],0,'사역동사 make + 목적어 + 동사원형(stay).'),
m('어법','It is similar to how helicopters get ____ and stay in the air.',['lifted','lifting','lift','to lift'],0,'헬리콥터가 “떠올려지는” 것이므로 get + p.p.(수동)입니다.')]},
{n:'Rising from the Ashes',k:'본문 6번 · Eucalyptus',q:[
m('문장삽입','다음 문장이 들어갈 위치로 알맞은 곳은?\n[Birds cannot eat them because they are securely protected by a strong shell.]\n\nEucalyptus seeds are as tiny as grains of sand, but they are bound together in firm capsules. (①) In long periods of hot and dry weather, the leaves rub together and catch fire. (②) The extreme heat causes the shell to crack open. (③) Finally, the seeds come out and begin to grow. (④)',['①','②','③','④'],0,'them = seeds, a strong shell = capsules이므로 캡슐을 설명한 직후(①)에 와야 하고, ② 이후 “the shell”도 자연스럽게 이어집니다.'),
m('어법','Some plants only release their seeds after ____ an extreme experience.',['enduring','to endure','endure','endured'],0,'전치사 after 뒤에는 동명사(enduring)가 옵니다.'),
m('어법','Eucalyptus is only able to reproduce provided that there ____ fire.',['is','will be','being','to be'],0,'provided that = if(조건). 조건 부사절에서는 현재시제가 미래를 대신합니다.'),
m('우리말 해석','“Eucalyptus is only able to reproduce provided that there is fire.”의 해석은?',['eucalyptus는 화재가 있을 경우에만 번식할 수 있다.','eucalyptus는 화재가 있으면 번식할 수 없다.','eucalyptus는 화재를 일으켜서 번식한다.','eucalyptus는 화재 때문에 번식하지 못한다.'],0,'only ... provided that ~ = ~한 경우에만 ...할 수 있다.'),
m('우리말 해석','“Birds cannot eat them because they are securely protected by a strong shell.”의 해석은?',['새들은 그것들이 강한 껍질로 단단히 보호되어 있어서 먹을 수 없다.','새들은 강한 껍질을 보호하기 위해 그것을 먹지 않는다.','그것들은 새를 보호하는 강한 껍질이다.','새들은 껍질이 강해서 그것들을 보호한다.'],0,'because 절의 주어 they = 씨앗들(them), are protected = 수동태.')]},
{n:'The Tallest Tree on Earth',k:'본문 7번 · Hyperion',q:[
m('내용일치','Hyperion에 대한 설명으로 일치하는 것은?',['2006년에 발견된 115 m 이상의 가장 높은 나무다.','Helios보다 낮다.','공원은 정확한 위치를 널리 알린다.','Helios가 발견된 후에 이름 붙여졌다.'],0,'Helios(114 m)보다 높은 나무를 2006년에 발견했고, 위치는 비밀입니다.'),
m('지시대상','“Before it was discovered, Helios ... was considered the tallest tree.” it이 가리키는 것은?',['Hyperion','Helios','Redwood National Park','the Titan'],0,'Hyperion이 발견되기 전에는 Helios가 가장 높은 나무로 여겨졌습니다.'),
m('지시대상','“They were so overwhelmed by its height ...” They가 가리키는 것은?',['two naturalists','redwoods','Titans','visitors'],0,'바로 앞 문장의 two naturalists입니다.'),
m('문맥 이해','공원이 Hyperion의 정확한 위치를 비밀로 하는 이유는?',['방문객으로 인한 잠재적 피해로부터 보호하려고','아무도 위치를 몰라서','나무가 너무 작아서','관광객을 늘리려고'],0,'“to protect it from potential harm caused by visitors”.'),
m('문맥 이해','“the odds of you seeing Hyperion at the park are slim to none”의 의미는?',['볼 가능성이 거의 없다','쉽게 볼 수 있다','반드시 볼 수 있다','절반쯤 볼 수 있다'],0,'slim to none = 가능성이 거의 없는. 뒤에서 위치 비밀과 높이 차이(몇 미터)를 근거로 듭니다.'),
m('유의어','본문의 merely와 가장 가까운 것은?',['only','hardly','mostly','nearly'],0,'merely = only(단지). “merely a few meters” = 몇 미터에 불과한.')]}
];
D[0].q.push(
s('빈칸(서술)','Seeds, ____ particular, are one of the strongest survival techniques. (전치사)',['in'],'in particular = 특히.'));

s('빈칸(서술)','Plants will do anything to ____ their seeds. (퍼뜨리다, s로 시작)',['spread'],'식물은 씨앗을 퍼뜨리기 위해 무엇이든 합니다.'),
m('유의어','본문 2번의 distributing과 의미가 가장 가까운 단어를 본문 3번에서 고르면?',['attach','scatter','resemble','inhabit'],1,'distribute(퍼뜨리다) ≈ scatter(흩뿌리다, 3번 첫 문장).'),
m('어법','It tempts animals to eat delicious fruit meat, thereby ____ them to eat the seeds.',['getting','get','gets','to get'],0,'thereby + 현재분사(분사구문): 그렇게 함으로써 ~하게 하다.'),
m('지시대상','“The fruit meat is digested by the animals that consume it ...”에서 it은?',['the fruit meat','the seeds','jackfruit','the digestive tract'],0,'동물이 먹는 대상은 과육(the fruit meat)입니다.'),
m('내용이해','Jackfruit이 퍼지는 과정의 순서로 알맞은 것은?',['과육 먹음 → 씨앗은 소화되지 않고 통과 → 배변 → 발아','씨앗 소화 → 배변 → 과육 먹음 → 발아','배변 → 과육 먹음 → 소화 → 발아','발아 → 과육 먹음 → 배변 → 소화'],0,'동물은 과육만 소화하고 씨앗은 훼손 없이 배출되어 자라 퍼집니다.'));
D[2].q.push(
s('빈칸(서술)','Instead of tempting sweet fruits, these seeds are ____ with sharp hooks or needles. (갖추고 있다, e로 시작)',['equipped'],'be equipped with ~ = ~을 갖추고 있다.'),
m('어법','Its blossoms ____ pink trumpets eventually transform into fruits with many hooks.',['resembling','resembled','are resembled','to resemble'],0,'주어 blossoms를 수식하는 현재분사구(= that resemble). 본동사는 transform.'),
m('지시대상','“..., making them feel like the devil is scratching them ...”에서 them은?',['the animals','the hooks','the seeds','the plants'],0,'갈고리가 동물들에게 심한 통증을 주어 동물들이 그렇게 느끼게 합니다.'),
m('우리말 해석','“As animals pass by, the hooks extending in all directions will keep the dried fruit firmly attached to their fur.”의 해석은?',['동물이 지나갈 때, 사방으로 뻗은 갈고리가 마른 열매를 털에 단단히 붙어 있게 한다.','동물이 지나가면 갈고리가 사방으로 떨어져 나간다.','동물이 갈고리를 털에 붙여 열매를 말린다.','마른 열매가 사방으로 뻗어 동물을 막는다.'],0,'keep + 목적어 + 과거분사(attached): ~가 붙어 있게 하다.'));
D[3].q.push(
m('유의어','본문 4번의 numerous와 같은 뜻으로 본문 3번 첫 문장에 쓰인 단어는?',['Many','Some','Few','All'],0,'numerous(수많은) ≈ many.'),
m('유의어','본문 4번의 deceiving과 의미가 가장 가까운 것은? (본문 4번 마지막 문장 참고)',['tricking','helping','chasing','feeding'],0,'“By tricking dung beetles”와 같은 의미입니다.'),
m('어법','By tricking dung beetles ____ roll away and bury the seeds, silver arrow-reed spreads seeds better.',['to','by','that','for'],0,'trick + 목적어 + to부정사: ~하도록 속이다.'),
m('어법','The beetles roll the seed carefully as if it ____ antelope dung.',['were','is','be','being'],0,'as if 가정법: 사실이 아님 → were.'),
s('빈칸(서술)','That is ____ dung beetles are often spotted rolling silver arrow-reed seeds. (이유 관계부사)',['why'],'That is why ~ = 그것이 ~하는 이유이다.'),
m('지시대상','“Their visual appearance and smell are quite similar to antelope dung.”에서 Their는?',['silver arrow-reed의 씨앗','쇠똥구리','영양','남아프리카'],0,'바로 앞 문장의 Silver arrow-reed seeds.'));
D[4].q.push(
s('생략된 부분(서술형)','“Some are carried by the wind.”에서 Some 뒤에 생략된 명사를 쓰시오.',['seeds'],'앞 문장 Not all seeds ...의 seeds가 반복되어 생략되었습니다.'),
s('배수 표현','“씨앗이 3배 멀리 날아간다”: The seed flies three times as ____ as the other. (멀리, f로 시작)',['far'],'배수 + as + 원급 + as.'),
m('배수 표현','“A seed is twice as heavy as B.”와 같은 의미는?',['A seed is twice the weight of B.','A seed is half the weight of B.','A seed is twice lighter than B.','A seed is two as weight as B.'],0,'twice as heavy as = twice the weight of.'),
m('지시대상','“As a result, it can travel much farther from the parent tree.”에서 it은?',['the maple seed','the parent tree','the helicopter','the wind'],0,'회전하는 단풍나무 씨앗이 모체에서 더 멀리 이동합니다.'),
m('내용이해','회전이 씨앗에 주는 이점이 아닌 것은?',['동물에게 먹이를 제공한다','공중에 더 오래 머문다','낙하 속도가 느려진다','낙하 중 손상이 줄어든다'],0,'먹이 제공은 2번 jackfruit의 방식입니다.'));
D[5].q.push(
s('빈칸(서술)','Eucalyptus seeds ... are ____ together in firm capsules. (묶여 있다, b로 시작)',['bound'],'be bound together = 함께 묶여 있다.'),

function rs(i){if(confirm('이 섹션의 기록을 지우고 처음부터 할까요?')){delete S[i];sv();home()}}
function ask(i){const d=D[i],s=st(i);
if(!s.q.length){$.innerHTML=`<div class=card><h2>${d.n}</h2><h1>${cnt(i)} / ${d.q.length}</h1><p>모든 문제를 맞혔습니다. 틀린 문제도 다시 풀어 정답을 확인했어요.</p><button class=p onclick=home()>홈으로</button></div>`;return}
const j=s.q[0],q=d.q[j],r=s.f[j]===false;
let h=`<div class=card><small>${d.n} · 남은 문제 ${s.q.length}</small><br><span class=tag>${q.t}</span>${r?' <span class=tag style="background:var(--no)">다시 풀기</span>':''}<p>${q.q}</p>`;
h+=q.o?q.o.map((o,k)=>`<button onclick="ans(${i},${j},${k})">${'①②③④⑤'[k]} ${o}</button>`).join(''):`<input id=v autocomplete=off autocapitalize=off placeholder="정답 입력"><button class=p onclick="ans(${i},${j},document.getElementById('v').value)">확인</button>`;
$.innerHTML=h+'<button onclick=home()>← 홈으로 (진행 상황 저장됨)</button></div>'}
function ans(i,j,v){const q=D[i].q[j],s=st(i),ok=q.o?v===q.a:q.a.some(x=>nm(x)==nm(v));
if(s.f[j]===undefined)s.f[j]=ok;s.q.shift();if(!ok)s.q.push(j);sv();
let h=`<div class=card><span class=tag>${q.t}</span><p>${q.q}</p>`;
if(q.o)h+=q.o.map((o,k)=>`<div class="card ${k==q.a?'ok':k==v?'no':''}" style="padding:8px 12px;margin:5px 0">${'①②③④⑤'[k]} ${o}</div>`).join('');
h+=`<h3>${ok?'⭕ 정답입니다!':'❌ 오답입니다'}</h3>`;
if(!ok)h+=`<p>${q.o?'':'내 답: '+esc(v)+'\n'}정답: <b>${q.o?'①②③④⑤'[q.a]:q.a[0]}</b></p>`;
h+=`<p class=ex>${q.e}</p>${ok?'':'<small>이 문제는 섹션 끝에서 다시 나옵니다.</small>'}<button class=p onclick="ask(${i})">${s.q.length?'다음 문제':'결과 보기'}</button></div>`;$.innerHTML=h}
home();
</script></body></html>
