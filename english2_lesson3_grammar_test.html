const K='eng2_l3_gram';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},$=document.getElementById('app'),
nm=x=>String(x).toLowerCase().replace(/[^a-z0-9가-힣]/g,''),esc=x=>String(x).replace(/</g,'&lt;'),
st=i=>S[i]||(S[i]={f:{},q:D[i].q.map((_,j)=>j)}),cnt=i=>S[i]?Object.values(S[i].f).filter(Boolean).length:0,
sh=(i,q)=>`<div class=ps><small>지문 ${q.n}번 문장</small><br>${P[i][q.n-1].replace(q.r[0],q.r[1])}</div>`,
pv=i=>`<details><summary>📖 전체 지문 보기</summary><div class=ps>${P[i].map((x,k)=>`<b>${k+1}</b> ${x}`).join(' ')}</div></details>`;
function home(){let t=0,n=0,h='<h2>영어Ⅱ 3과 어법 집중 테스트</h2><small>문장 속 어법 포인트를 유형별로 연습해요.</small>';
D.forEach((d,i)=>{const s=S[i],a=s?Object.keys(s.f).length:0,c=cnt(i),N=d.q.length,dn=s&&!s.q.length;t+=c;n+=N;
h+=`<div class=card><small>${d.k}</small><br><b>${d.n}</b><div class=bar><i style="width:${a/N*100}%"></i></div><small>${a}/${N} 풀이 · ${dn?'완료 · 점수 '+c+'/'+N:'첫 시도 정답 '+c}</small><button class=p onclick="ask(${i})">${dn?'결과 보기':a?'이어서 풀기':'시작'}</button>${a?`<button onclick="rs(${i})">처음부터 다시</button>`:''}</div>`});
$.innerHTML=h+`<div class=card>전체 점수(첫 시도 기준): <b>${t}/${n}</b></div>`}
function rs(i){if(confirm('이 섹션의 기록을 지우고 처음부터 할까요?')){delete S[i];sv();home()}}
function ask(i){const d=D[i],s=st(i);
if(!s.q.length){$.innerHTML=`<div class=card><h2>${d.n}</h2><h1>${cnt(i)} / ${d.q.length}</h1><p>모든 문제를 맞혔습니다. 틀린 문제도 다시 풀어 정답을 확인했어요.</p><button class=p onclick=home()>홈으로</button></div>`;return}
const j=s.q[0],q=d.q[j],r=s.f[j]===false;
let h=`<div class=card><small>${d.n} · 남은 문제 ${s.q.length}</small><br><span class=tag>${q.t}</span>${r?'<span class=tag style="background:var(--no)">다시 풀기</span>':''}${sh(i,q)}<p>${q.q}</p>`;
h+=q.o?q.o.map((o,k)=>`<button onclick="ans(${i},${j},${k})">${q.o===N?'':'①②③④⑤'[k]+' '}${o}</button>`).join(''):`<input id=v autocomplete=off autocapitalize=off placeholder="정답 입력"><button class=p onclick="ans(${i},${j},document.getElementById('v').value)">확인</button>`;
$.innerHTML=h+pv(i)+'<button onclick=home()>← 홈으로 (진행 상황 저장됨)</button></div>'}
function ans(i,j,v){const q=D[i].q[j],s=st(i),ok=q.o?v===q.a:q.a.some(x=>nm(x)==nm(v));
if(s.f[j]===undefined)s.f[j]=ok;s.q.shift();if(!ok)s.q.push(j);sv();
let h=`<div class=card><span class=tag>${q.t}</span>${sh(i,q)}<p>${q.q}</p>`;
