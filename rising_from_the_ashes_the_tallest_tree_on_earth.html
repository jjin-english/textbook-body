<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어Ⅱ 3과 · Rising from the Ashes & The Tallest Tree on Earth</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --sec1-accent: #d97706;
      --sec1-soft: #fffbeb;
      --sec1-border: #fde68a;
      --sec2-accent: #059669;
      --sec2-soft: #ecfdf5;
      --sec2-border: #a7f3d0;
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #6ee7b7;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --hl-bg: #fef3c7;
      --hl-border: #f59e0b;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 72px 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
    }

    /* 상단 고정 헤더 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 740px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-top {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-top:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .btn-top.share-btn {
      background: #fef08a;
      border-color: #eab308;
      color: #422006;
      font-weight: 700;
    }

    .btn-top.share-btn:hover {
      background: #fde047;
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 18px 16px 0 16px;
    }

    /* 토스트 알림 */
    .toast {
      display: none;
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: #1e293b;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    .toast.show {
      display: block;
    }

    /* 섹션 필터 탭 */
    .filter-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab-btn {
      appearance: none;
      border: 1.5px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 8px;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    /* 섹션 구분 블록 */
    .quiz-section {
      margin-bottom: 34px;
    }

    .quiz-section.hidden {
      display: none;
    }

    .section-header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-header.sec1 {
      border-left: 6px solid var(--sec1-accent);
    }

    .section-header.sec2 {
      border-left: 6px solid var(--sec2-accent);
    }

    .section-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-badge {
      display: inline-block;
      width: fit-content;
      font-size: 12.5px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .sec1 .section-badge {
      background: var(--sec1-soft);
      color: #92400e;
      border: 1px solid var(--sec1-border);
    }

    .sec2 .section-badge {
      background: var(--sec2-soft);
      color: #065f46;
      border: 1px solid var(--sec2-border);
    }

    .section-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .section-score {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 999px;
    }

    /* 문제 리스트 & 카드 */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .q-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s ease;
    }

    .q-card.is-correct {
      border-color: var(--success-border);
    }

    .q-card.is-wrong {
      border-color: var(--danger-border);
    }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .q-num {
      display: inline-block;
      background: var(--text);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 6px;
    }

    .q-type-tag {
      display: inline-block;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 6px;
    }

    .q-prompt {
      margin: 0 0 14px 0;
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.55;
    }

    .passage-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      font-size: 16.5px;
      line-height: 1.8;
      color: #1e293b;
      word-break: normal;
    }

    .hl {
      background: var(--hl-bg);
      border-bottom: 2px solid var(--hl-border);
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 700;
      color: #92400e;
    }

    /* 객관식 선택지 */
    .mc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mc-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1.5px solid var(--border-strong);
      background: #ffffff;
      color: var(--text);
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.55;
      padding: 13px 15px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mc-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .mc-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: #1e3a8a;
      font-weight: 700;
    }

    .mc-btn.correct-opt {
      border-color: var(--success);
      background: var(--success-bg);
      color: #064e3b;
      font-weight: 700;
    }

    .mc-btn.wrong-opt {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
      font-weight: 700;
    }

    .mc-btn:disabled {
      cursor: default;
    }

    .mc-num {
      flex-shrink: 0;
      font-weight: 800;
    }

    /* 서술형 입력창 */
    .subj-wrap {
      margin-bottom: 16px;
    }

    .subj-input {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: #ffffff;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .subj-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .subj-input:disabled {
      background: #f8fafc;
      color: var(--text-sub);
    }

    textarea.subj-input {
      min-height: 92px;
      resize: vertical;
    }

    /* 하단 버튼 행 */
    .q-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-primary {
      appearance: none;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-retry {
      appearance: none;
      border: 1.5px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-retry:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    /* 정답 및 해설 박스 (정답 확인 후에만 표시) */
    .result-box {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-size: 15px;
      line-height: 1.65;
    }

    .result-box.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #064e3b;
    }

    .result-box.wrong {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: #7f1d1d;
    }

    .result-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .result-item {
      background: rgba(255, 255, 255, 0.85);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      display: inline-block;
      font-weight: 800;
      color: var(--primary);
      margin-right: 6px;
    }

    /* 하단 종합 결과 카드 */
    .summary-card {
      margin-top: 24px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-score {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .summary-sub {
      margin: 0;
      font-size: 14.5px;
      color: var(--text-sub);
    }

    .summary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    @media (max-width: 520px) {
      .header-title {
        font-size: 15.5px;
      }
      .tab-btn {
        font-size: 12.5px;
        padding: 10px 6px;
      }
      .q-card {
        padding: 18px 15px;
      }
      .passage-box {
        font-size: 15.5px;
        padding: 14px;
      }
      .mc-btn {
        font-size: 15px;
        padding: 12px 13px;
      }
    }
  </style>
</head>
<body>
  <!-- 상단 고정 점수 및 도구 바 -->
  <header class="top-header">
    <div class="header-inner">
      <div class="header-top-row">
        <h1 class="header-title">영어Ⅱ 3과 · 핵심 유형 연습</h1>
        <div id="top-score-pill" class="score-pill">0 / 13문제 · 0점</div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-top" onclick="retryWrongAll()">틀린 문제 다시 풀기</button>
        <button type="button" class="btn-top" onclick="resetAll()">전체 초기화</button>
        <button type="button" class="btn-top share-btn" onclick="copyShareLink()">링크 복사 (카톡 공유)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 토스트 알림 -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- 섹션 필터 탭 -->
    <nav class="filter-tabs" aria-label="단락 선택 탭">
      <button type="button" id="tab-all" class="tab-btn active" onclick="setSectionFilter('all')">
        전체 보기 (13)
      </button>
      <button type="button" id="tab-sec1" class="tab-btn" onclick="setSectionFilter('sec1')">
        Section 1<br />Rising from the Ashes
      </button>
      <button type="button" id="tab-sec2" class="tab-btn" onclick="setSectionFilter('sec2')">
        Section 2<br />The Tallest Tree on Earth
      </button>
    </nav>

    <!-- Section 1: Rising from the Ashes -->
    <section id="section-1" class="quiz-section" aria-label="Section 1: Rising from the Ashes">
      <div class="section-header sec1">
        <div class="section-title-group">
          <span class="section-badge">Section 1 · 우리말 해석 연습 (6문항)</span>
          <h2 class="section-title">Rising from the Ashes</h2>
        </div>
        <div id="sec1-score" class="section-score">0 / 6 정답</div>
      </div>
      <div id="sec1-list" class="question-list"></div>
    </section>

    <!-- Section 2: The Tallest Tree on Earth -->
    <section id="section-2" class="quiz-section" aria-label="Section 2: The Tallest Tree on Earth">
      <div class="section-header sec2">
        <div class="section-title-group">
          <span class="section-badge">Section 2 · 지시대상 & 문맥이해 연습 (7문항)</span>
          <h2 class="section-title">The Tallest Tree on Earth</h2>
        </div>
        <div id="sec2-score" class="section-score">0 / 7 정답</div>
      </div>
      <div id="sec2-list" class="question-list"></div>
    </section>

    <!-- 하단 종합 결과 카드 -->
    <section class="summary-card" aria-label="학습 결과 요약">
      <p id="bottom-score" class="summary-score">전체 성적: 0 / 13문제 정답 (0점)</p>
      <p id="bottom-detail" class="summary-sub">
        Section 1: 0 / 6 정답 · Section 2: 0 / 7 정답
      </p>
      <div class="summary-actions">
        <button type="button" class="btn-retry" onclick="retryWrongAll()">틀린 문제 다시 풀기</button>
        <button type="button" class="btn-retry" onclick="resetAll()">전체 초기화</button>
      </div>
    </section>
  </main>

  <script>
    const CIRCLED = ['', '①', '②', '③', '④', '⑤'];

    /**
     * 전체 13문항 데이터
     * Section 1 (s1-1 ~ s1-6): Rising from the Ashes (우리말 해석 연습)
     * Section 2 (s2-1 ~ s2-7): The Tallest Tree on Earth (지시대상 & 문맥이해 연습)
     */
    const QUESTIONS = [
      // ================= SECTION 1: Rising from the Ashes =================
      {
        id: 's1-1',
        section: 'sec1',
        numLabel: '1-1',
        typeTag: '우리말 해석 · 객관식',
        kind: 'mc',
        prompt: '다음 문장의 우리말 해석으로 가장 적절한 것을 고르시오.',
        passageHtml:
          'However, some plants <span class="hl">only</span> release their seeds <span class="hl">after enduring</span> an extreme experience.',
        options: [
          '그러나 일부 식물들은 극심한 경험을 견딘 후에야 씨앗을 방출한다.',
          '그러나 대부분의 식물들은 극심한 경험을 피한 후에 씨앗을 방출한다.',
          '그러나 일부 식물들은 씨앗을 방출한 뒤에야 극심한 경험을 견뎌낸다.',
          '그러나 일부 식물들은 극심한 경험을 겪는 동안 씨앗을 방출하지 못한다.',
          '그러나 모든 식물들은 극심한 경험 없이도 씨앗을 자동으로 방출한다.'
        ],
        answer: 1,
        explanation:
          '「only + 동사 ~ after -ing」 구문은 "~한 후에야 비로소 …하다"라는 뜻입니다. release는 "(씨앗을) 방출하다", endure는 "견디다"를 의미하므로 ①이 가장 정확한 해석입니다.'
      },
      {
        id: 's1-2',
        section: 'sec1',
        numLabel: '1-2',
        typeTag: '우리말 해석 · 객관식',
        kind: 'mc',
        prompt: '다음 문장의 우리말 해석으로 가장 적절한 것을 고르시오.',
        passageHtml:
          'Eucalyptus seeds are <span class="hl">as tiny as grains of sand</span>, but they are <span class="hl">bound together in firm capsules</span>.',
        options: [
          '유칼립투스 씨앗은 모래 알갱이보다 더 크며, 단단한 캡슐 밖에 흩어져 있다.',
          '유칼립투스 씨앗은 모래 알갱이만큼 작지만, 단단한 캡슐 안에 함께 묶여 있다.',
          '유칼립투스 씨앗은 모래 알갱이처럼 단단하지만, 부드러운 캡슐 안에 들어 있다.',
          '유칼립투스 씨앗은 모래 알갱이만큼 가볍지만, 캡슐에서 쉽게 분리된다.',
          '유칼립투스 씨앗은 모래 알갱이만큼 작아서, 단단한 캡슐을 뚫고 나온다.'
        ],
        answer: 2,
        explanation:
          '「as + 형용사 + as」 원급 비교(as tiny as grains of sand = 모래 알갱이만큼 작은)와 수동태 표현(are bound together in firm capsules = 단단한 캡슐 안에 함께 묶여 있다)을 정확히 살린 ②가 정답입니다.'
      },
      {
        id: 's1-3',
        section: 'sec1',
        numLabel: '1-3',
        typeTag: '우리말 해석 · 서술형',
        kind: 'subj-ko',
        multiline: true,
        placeholder: '문장의 우리말 해석을 직접 입력하세요.',
        prompt: '다음 문장을 우리말로 자연스럽게 해석하시오.',

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');

    function normalizeEn(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[.?!,;:"'()]+/g, '')
        .replace(/\s+/g, ' ')
        .trim();

     */
    function evaluateKoreanTranslation(userText, q) {
      const cleaned = String(userText || '').replace(/\s+/g, '').toLowerCase();
      if (cleaned.length < 6) return false;

      let matchedCount = 0;
      for (const group of q.keywordGroups) {
        const hit = group.some((kw) => cleaned.includes(kw.replace(/\s+/g, '').toLowerCase()));
        if (hit) matchedCount += 1;
      }
      return matchedCount >= q.minGroups;
    }

    /**
     * 전체 문제 렌더링
     */
    function renderAll() {
      const sec1List = document.getElementById('sec1-list');
      const sec2List = document.getElementById('sec2-list');
      sec1List.innerHTML = '';
      sec2List.innerHTML = '';

      QUESTIONS.forEach((q) => {
        const s = state[q.id];
        const card = document.createElement('article');
        card.id = `card-${q.id}`;
        card.className = 'q-card';
        if (s.checked) {
          card.classList.add(s.isCorrect ? 'is-correct' : 'is-wrong');
        }

        // 문제 입력 영역 (객관식 vs 서술형)
        let interactiveHtml = '';
        if (q.kind === 'mc') {
          const optsHtml = q.options
            .map((opt, idx) => {
              const num = idx + 1;
              let btnClass = 'mc-btn';
              if (!s.checked) {
                if (s.selected === num) btnClass += ' selected';
              } else {
                if (num === q.answer) {
                  btnClass += ' correct-opt';
                } else if (num === s.selected && s.selected !== q.answer) {
                  btnClass += ' wrong-opt';
                }
              }

              return `
                <button
                  type="button"
                  class="${btnClass}"
                  ${s.checked ? 'disabled' : ''}
                  onclick="selectMc('${q.id}', ${num})"
                >
                  <span class="mc-num">${CIRCLED[num]}</span>
                  <span>${escapeHtml(opt)}</span>
                </button>
              `;
            })
            .join('');

          interactiveHtml = `<div class="mc-list" role="group" aria-label="선택지">${optsHtml}</div>`;
        } else {
          if (q.multiline) {
            interactiveHtml = `
              <div class="subj-wrap">
                <textarea
                  id="input-${q.id}"
                  class="subj-input"
                  placeholder="${escapeAttr(q.placeholder)}"
                  ${s.checked ? 'disabled' : ''}
                  oninput="onTextInput('${q.id}', this.value)"
                >${escapeHtml(s.text)}</textarea>
              </div>
            `;
          } else {
            interactiveHtml = `
              <div class="subj-wrap">
                <input
                  id="input-${q.id}"
                  class="subj-input"
                  type="text"
                  value="${escapeAttr(s.text)}"
                  placeholder="${escapeAttr(q.placeholder)}"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  ${s.checked ? 'disabled' : ''}
                  oninput="onTextInput('${q.id}', this.value)"
                  onkeydown="onTextKeyDown(event, '${q.id}')"
                />
              </div>
            `;
          }
        }

        // 정답 확인 후에만 나타나는 정답 및 해설 박스
        let resultHtml = '';
        if (s.checked) {
          const correctText =
            q.kind === 'mc'
              ? `${CIRCLED[q.answer]} ${q.options[q.answer - 1]}`
              : q.modelAnswer;

          resultHtml = `
            <div class="result-box ${s.isCorrect ? 'correct' : 'wrong'}">
              <div class="result-title">
                ${s.isCorrect ? '정답입니다!' : '오답입니다. 아래 정답 및 해설을 확인해 보세요.'}
              </div>
              <div class="result-item">
                <span class="result-label">정답</span>${escapeHtml(correctText)}
              </div>
              <div class="result-item">
                <span class="result-label">해설</span>${escapeHtml(q.explanation)}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="q-meta">
            <span class="q-num">Q${q.numLabel}</span>
            <span class="q-type-tag">${escapeHtml(q.typeTag)}</span>
          </div>
          <h3 class="q-prompt">${escapeHtml(q.prompt)}</h3>
          <div class="passage-box">${q.passageHtml}</div>
          ${interactiveHtml}
          <div class="q-actions">
            ${
              !s.checked
                ? `<button type="button" class="btn-primary" onclick="checkQuestion('${q.id}')">정답 확인</button>`
                : ''
            }
            ${
              s.checked
                ? `<button type="button" class="btn-retry" onclick="retryOne('${q.id}')">이 문제 다시 풀기</button>`
                : ''
            }
          </div>
          ${resultHtml}
        `;

        if (q.section === 'sec1') {
          sec1List.appendChild(card);
        } else {
          sec2List.appendChild(card);
        }
      });
    }

    function selectMc(id, num) {
      if (state[id].checked) return;
      state[id].selected = num;
      renderAll();
    }

    function onTextInput(id, val) {
      state[id].text = val;
    }

    function onTextKeyDown(e, id) {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkQuestion(id);
      }
    }

    /**
     * 개별 문항 채점
     */
    function checkQuestion(id) {
      const q = QUESTIONS.find((item) => item.id === id);
      if (!q) return;

      const s = state[id];
      if (q.kind === 'mc') {
        if (s.selected === null) {
          showToast('보기(①~⑤) 중 하나를 먼저 선택해 주세요.');
          return;
        }
        s.isCorrect = s.selected === q.answer;
      } else {
        const el = document.getElementById(`input-${id}`);
        const raw = el ? el.value : s.text;
        s.text = raw;
        if (!raw.trim()) {
          showToast('답안을 먼저 입력해 주세요.');
          return;
        }

        if (q.kind === 'subj-en') {
          const norm = normalizeEn(raw);
          s.isCorrect = q.answers.some((ans) => normalizeEn(ans) === norm);
        } else {
          s.isCorrect = evaluateKoreanTranslation(raw, q);
        }
      }

      s.checked = true;
      updateScores();
      renderAll();
    }

    /**
     * 개별 문항 다시 풀기
     */
    function retryOne(id) {
      state[id].selected = null;
      state[id].text = '';
      state[id].checked = false;
      state[id].isCorrect = false;
      updateScores();
      renderAll();
    }

    /**
     * 틀린 문제만 일괄 다시 풀기
     */
    function retryWrongAll() {
      const wrongQuestions = QUESTIONS.filter(
        (q) => state[q.id].checked && !state[q.id].isCorrect
      );

      if (wrongQuestions.length === 0) {
        showToast('현재 틀린 문제가 없습니다.');
        return;
      }

      wrongQuestions.forEach((q) => {
        state[q.id].selected = null;
        state[q.id].text = '';
        state[q.id].checked = false;
        state[q.id].isCorrect = false;
      });

      // 필터가 걸려 있어 오답 문항이 숨겨져 있다면 전체 보기로 전환
      if (currentFilter !== 'all') {
        const hasInCurrent = wrongQuestions.some((q) => q.section === currentFilter);
        if (!hasInCurrent) {
          setSectionFilter('all');
        }
      }

      updateScores();
      renderAll();

      const firstCard = document.getElementById(`card-${wrongQuestions[0].id}`);
      if (firstCard) {
        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      showToast(`틀린 ${wrongQuestions.length}문제를 초기화했습니다.`);
    }

    /**
     * 전체 초기화
     */
    function resetAll() {
      QUESTIONS.forEach((q) => {
        state[q.id].selected = null;
        state[q.id].text = '';
        state[q.id].checked = false;
        state[q.id].isCorrect = false;
      });
      updateScores();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('모든 문제를 초기화했습니다.');
    }

    /**
     * 전체 및 섹션별 점수 갱신
     */
    function updateScores() {
      const total = QUESTIONS.length;
      const sec1Qs = QUESTIONS.filter((q) => q.section === 'sec1');
      const sec2Qs = QUESTIONS.filter((q) => q.section === 'sec2');

      const totalCorrect = QUESTIONS.filter((q) => state[q.id].checked && state[q.id].isCorrect).length;
      const sec1Correct = sec1Qs.filter((q) => state[q.id].checked && state[q.id].isCorrect).length;
      const sec2Correct = sec2Qs.filter((q) => state[q.id].checked && state[q.id].isCorrect).length;

      const pct = Math.round((totalCorrect / total) * 100);

      document.getElementById('top-score-pill').textContent = `${totalCorrect} / ${total}문제 · ${pct}점`;
      document.getElementById('sec1-score').textContent = `${sec1Correct} / ${sec1Qs.length} 정답`;
      document.getElementById('sec2-score').textContent = `${sec2Correct} / ${sec2Qs.length} 정답`;
      document.getElementById('bottom-score').textContent = `전체 성적: ${totalCorrect} / ${total}문제 정답 (${pct}점)`;
      document.getElementById('bottom-detail').textContent =
        `Section 1 (Rising from the Ashes): ${sec1Correct} / ${sec1Qs.length} 정답 · Section 2 (The Tallest Tree on Earth): ${sec2Correct} / ${sec2Qs.length} 정답`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateScores();
      renderAll();
    });
  </script>
</body>
