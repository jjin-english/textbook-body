<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어2 천재 3과 일일 연습</title>
<style>

</style></head><body><div id="app"></div><script>
const D=[
{w:"amazing:놀라운|throughout:~동안 내내|existence:존재|create:만들다, 창조하다|diverse:다양한|survival:생존|strategy:전략|particular:특정한|in particular:특히|strong:강력한|technique:기술|develop:개발하다|discover:발견하다|fascinating:매혹적인|mysterious:신비로운",
s:[["Plants are {amazing}.","식물은 놀랍다."],
["Throughout their long existence, they {have created} diverse survival strategies.","그들의 긴 존재 기간 동안 그들은 다양한 생존 전략을 만들어 왔다."],
["Seeds, {in particular}, are one of the strongest survival {techniques} they have developed.","씨앗은 특히 그들이 개발해 온 가장 강력한 생존 기술 중 하나이다."],
["Let's {discover} the {fascinating} and mysterious world of seeds.","씨앗의 매혹적이고 신비로운 세계를 발견해 보자."]]},
{w:"plant:식물|spread:퍼뜨리다|seed:씨앗|offer:제공하다|distribute:분배하다|in return for:~에 대한 대가로|jackfruit:잭프루트|attract:끌어들이다|similar:유사한|tempt:유혹하다|delicious:맛있는|thereby:그것에 의하여|digest:소화하다|consume:섭취하다|digestive:소화의|tract:관|untouched:손상되지 않은|sprout:싹트다|poop out:배변으로 내보내다|satisfying:만족스러운|in exchange for:~와 교환하여",
s:[["Plants {will do} anything to spread their seeds.","식물은 씨앗을 퍼뜨리기 위해 무엇이든 할 것이다."],
["They {offer} tasty food to animals {in return for} distributing their seeds.","그들은 씨앗을 분산시켜 주는 것에 대한 보답으로 동물들에게 맛있는 먹이를 제공한다."],
["Jackfruit, the world's largest tree fruit, has a sweet smell that {attracts} animals, similar to pineapples and bananas.","세계에서 가장 큰 나무 열매인 잭프루트는 파인애플과 바나나와 비슷하게 동물들을 유인하는 달콤한 냄새를 가지고 있다."],
["It {tempts} animals to eat delicious fruit meat, thereby getting them to eat the seeds.","그것은 동물들이 맛있는 과육을 먹도록 유혹하여 씨앗도 먹게 한다."],
["The fruit meat {is digested} by the animals that consume it, but the seeds {are not digested} and pass through the animals' digestive tracts untouched.","과육은 그것을 섭취하는 동물에 의해 소화되지만, 씨앗은 소화되지 않고 동물의 소화관을 손상되지 않은 채 통과한다."],
["When these animals poop out the seeds, the seeds begin to {sprout} and grow, and jackfruit spreads.","이 동물들이 씨앗을 배변하면 씨앗이 싹트고 자라기 시작하며 잭프루트가 퍼진다."],
["{In exchange for} a satisfying meal, the animals {spread} the jackfruit seeds.","만족스러운 식사의 대가로 동물들은 잭프루트 씨앗을 퍼뜨린다."]]},
{w:"opt:선택하다|scatter:흩뿌리다|attach:붙이다|benefit:이점, 혜택|equip:갖추다|sharp:날카로운|hook:갈고리|needle:바늘|instead of:~대신에|vicious:악랄한, 잔인한|stand out:두드러지다|primarily:주로|inhabit:서식하다|desert:사막|blossom:꽃|resemble:닮다|trumpet:트럼펫|eventually:결국|transform:변형시키다|solid:단단한, 고체의|tough:튼튼한, 질긴|extend:뻗다|direction:방향|firmly:단단히|fur:털|pass by:지나가다|various:다양한|location:장소, 위치|move away:떠나다|severe:심한, 가혹한|pain:고통|scratch:할퀴다, 긁다|horrify:소름 끼치게 하다|claw:발톱|rider:탄 사람, 승객",
s:[["Many plants {opt} to scatter their seeds by providing food to animals, but not all of them do.","많은 식물은 동물에게 음식을 제공함으로써 씨앗을 퍼뜨리는 것을 선택하지만, 모두가 그렇지는 않다."],
["Some plants {attach} their seeds to passing animals, spreading them without any return benefit.","일부 식물은 지나가는 동물에게 씨앗을 붙여 아무런 대가 없이 퍼뜨린다."],
["{Instead of} tempting sweet fruits, these seeds {are equipped} with sharp hooks or needles.","유혹하는 달콤한 과일 대신에 이 씨앗들은 날카로운 갈고리나 바늘을 갖추고 있다."],
["Devil's claw {stands out} as the most vicious of these plants.","악마의 발톱은 이 식물들 중에서 가장 악랄한 것으로 두드러진다."],
["Devil's claw primarily {inhabits} the Kalahari Desert in South Africa, Namibia, and Botswana.","악마의 발톱은 주로 남아프리카, 나미비아, 보츠와나의 칼라하리 사막에 서식한다."],
["Its blossoms resembling pink trumpets {eventually transform} into fruits with many hooks.","분홍색 나팔을 닮은 그 꽃들은 결국 많은 갈고리가 달린 열매로 변한다."],
["As these fruits dry, they {become} solid, and their hooks become tough enough to attach to the bodies of animals.","이 열매들이 마르면 단단해지고, 갈고리는 동물의 몸에 붙을 수 있을 만큼 튼튼해진다."],
["As animals pass by, the hooks extending in all directions {will keep} the dried fruit {firmly} attached to their fur.","동물들이 지나갈 때, 모든 방향으로 뻗은 갈고리들은 마른 열매를 털에 단단히 붙어 있게 할 것이다."],
["As the animals {move away}, the seeds from the fruit {will be scattered} in various locations.","동물들이 떠나가면 열매에서 나온 씨앗들은 다양한 장소에 흩뿌려질 것이다."],
["The attached hooks {cause} severe pain to the animals, making them feel like the devil is scratching them with its horrifying claws.","붙어 있는 갈고리들은 동물들에게 심한 고통을 유발하여, 마치 악마가 그 끔찍한 발톱으로 긁는 것처럼 느끼게 만든다."],
["That is how devil's claw {became known} as the worst free rider.","그것이 악마의 발톱이 최악의 무임승차자로 알려지게 된 방식이다."]]},
{w:"numerous:수많은|creative:창의적인|method:방법|particularly:특히|unique:독특한|deceive:속이다|dung:배설물|beetle:딱정벌레|antelope:영양|bury:묻다|lay:(알을) 낳다|by nature:선천적으로, 본래|round:둥근|slightly:약간|visual:시각적인|appearance:겉모습|approach:접근하다|within:~이내에|carefully:조심스럽게|roll away:굴려가다|as if:마치 ~인 것처럼|spot:발견하다|confused:혼란스러운|realize:깨닫다|abort:중단하다|have no choice but to:~할 수밖에 없다|search for:~을 찾다|trick:속이다|plant:심다",
s:[["Out of numerous {creative} methods for spreading seeds, silver arrow-reed in South Africa has a particularly unique one.","씨앗을 퍼뜨리는 수많은 창의적인 방법 중에서, 남아프리카의 은화살갈대는 특히 독특한 방법을 가지고 있다."],
["Silver arrow-reed spreads its seeds by {deceiving} dung beetles.","은화살갈대는 쇠똥구리를 속임으로써 씨앗을 퍼뜨린다."],
["Dung beetles, {by nature}, roll antelope dung and bury it in the ground to eat or lay eggs in.","쇠똥구리는 본래 영양 똥을 굴리고 땅에 묻어 먹거나 그 안에 알을 낳는다."],
["Silver arrow-reed seeds are dark brown, round, and {slightly} larger than 1 cm in size.","은화살갈대 씨앗은 짙은 갈색이고 둥글며 크기가 1cm보다 약간 크다."],
["Their visual appearance and smell are quite {similar to} antelope dung.","그것들의 시각적 모습과 냄새는 영양 똥과 상당히 비슷하다."],
["So when a seed {falls} onto the ground, dung beetles {will approach} the fallen seed within minutes.","그래서 씨앗이 땅에 떨어지면 쇠똥구리는 몇 분 안에 떨어진 씨앗에 접근할 것이다."],
["Then, they carefully roll the seed away {as if} it {were} antelope dung.","그러면 그들은 마치 그것이 영양 똥인 것처럼 씨앗을 조심스럽게 굴려 옮긴다."],
["That is why dung beetles {are spotted} rolling silver arrow-reed seeds that look and smell like dung balls.","그것이 똥 덩어리처럼 보이고 냄새나는 은화살갈대 씨앗을 굴리는 쇠똥구리가 목격되는 이유이다."],
["When they try to eat the seeds or lay eggs inside of them, however, the {confused} beetles will {realize} they cannot.","하지만 씨앗을 먹거나 그 안에 알을 낳으려 할 때, 혼란스러운 쇠똥구리는 그럴 수 없다는 것을 깨달을 것이다."],
["They {have no choice but to} abort and search for real dung balls.","그들은 포기하고 진짜 똥 덩어리를 찾을 수밖에 없다."],
["By {tricking} dung beetles to roll away and bury the seeds, silver arrow-reed {is able to} spread and plant its seeds better.","쇠똥구리를 속여 씨앗을 굴려 옮기고 묻게 함으로써, 은화살갈대는 씨앗을 더 잘 퍼뜨리고 심을 수 있다."]]},
{w:"transport:운송하다|approach:접근법, 방법|maple:단풍나무|boomerang:부메랑|irregular:불규칙한|ridge:융기, 능선|surface:표면|spin:회전하다, 돌다|rotation:회전|helicopter:헬리콥터|propeller:프로펠러|elevate:들어 올리다|parent:모체의, 어미의|as a result:결과적으로|softly:부드럽게|land:착륙하다|slow down:늦추다|reduce:줄이다|damage:손상, 피해",
s:[["Not all seeds {are transported} by animals.","모든 씨앗이 동물에 의해 운반되는 것은 아니다."],
["Some {are carried} by the wind.","일부는 바람에 의해 운반된다."],
["This {approach} is used by maple trees.","이러한 방식은 단풍나무에 의해 사용된다."],
["Maple seeds {are shaped} like a boomerang with irregular ridges on the surface.","단풍나무 씨앗은 표면에 불규칙한 능선이 있는 부메랑처럼 생겼다."],
["When a maple seed falls from the tree, it {spins} around.","단풍나무 씨앗이 나무에서 떨어질 때 그것은 빙글빙글 돈다."],
["This rotation {makes} the seed stay in the air longer and fly farther.","이 회전은 씨앗이 공중에 더 오래 머물고 더 멀리 날아가도록 만든다."],
["It is similar to how helicopters {get lifted} and stay in the air using their propellers.","그것은 헬리콥터가 프로펠러를 사용해 들어 올려지고 공중에 머무는 방식과 유사하다."],
["The rotation caused by its wings {allows} the maple seed to {elevate} twice as high as non-rotating seeds.","날개에 의해 야기되는 회전은 단풍나무 씨앗이 회전하지 않는 씨앗보다 두 배 높이 떠오르게 한다."],
["{As a result}, it can travel much farther from the parent tree.","결과적으로 그것은 모체 나무로부터 훨씬 더 멀리 이동할 수 있다."],
["The rotation also {slows down} the speed of the fall, and the seed softly lands on the ground.","그 회전은 또한 낙하 속도를 늦추고, 씨앗은 땅에 부드럽게 착륙한다."],
["This helps {reduce} the damage to the seed during the fall.","이것은 낙하 중 씨앗에 가해지는 손상을 줄이는 데 도움이 된다."]]},
{w:"mature:성숙한|automatically:자동으로|separate:분리하다|release:방출하다|endure:견디다|extreme:극심한|experience:경험|tiny:아주 작은|grain:알갱이|bind:묶다|firm:단단한|capsule:캡슐|securely:단단히, 안전하게|protect:보호하다|shell:껍질|period:기간|rub:문지르다|naturally:자연적으로|contain:포함하다|highly:매우, 대단히|flammable:인화성이 있는|catch fire:불이 붙다|cause:야기하다|crack:갈라지다|conveniently:편리하게|conceal:숨기다|ash:재|harsh:가혹한|environment:환경|left over:~이 남은|wildfire:산불|practically:거의, 사실상|destroy:파괴하다|compete:경쟁하다|growth:성장|reproduce:번식하다|provided that:~라는 조건으로, 만약 ~라면",
s:[["In most cases, mature seeds {are automatically separated} from the parent plant.","대부분의 경우 성숙한 씨앗은 모식물로부터 자동으로 분리된다."],
["However, some plants only {release} their seeds after enduring an extreme experience.","하지만 일부 식물은 극심한 경험을 견뎌낸 후에야 씨앗을 방출한다."],
["Eucalyptus is {one such example}.","유칼립투스는 그러한 예 중 하나이다."],
["Eucalyptus seeds are as tiny as grains of sand, but they are {bound} together in firm capsules.","유칼립투스 씨앗은 모래알만큼 작지만 단단한 캡슐 안에 묶여 있다."],
["Birds {cannot eat} them because they are securely {protected} by a strong shell.","새들은 그것들을 먹을 수 없는데, 단단한 껍질에 의해 안전하게 보호되기 때문이다."],
["In long periods of hot and dry weather, eucalyptus leaves rub together and naturally {catch fire} because the leaves {contain} highly flammable oil.","길고 덥고 건조한 날씨에는 잎에 인화성이 강한 기름이 들어 있어서 유칼립투스 잎이 서로 비벼지고 자연적으로 불이 붙는다."],
["The extreme heat from the fire {causes} the shell to crack open.","불에서 나는 극심한 열은 껍질이 갈라지게 한다."],
["Finally, the seeds come out of the shell, hit the ground, and {begin} to grow.","마침내 씨앗은 껍질 밖으로 나와 땅에 떨어지고 자라기 시작한다."],
["The fallen seeds are {conveniently concealed} in the soft ash left over after the fire, which protects them from the harsh environment.","떨어진 씨앗은 불이 난 후 남은 부드러운 재 속에 편리하게 숨겨지고, 그것은 씨앗을 혹독한 환경으로부터 보호한다."],
["Wildfire, often started by the parent tree, also burns {practically} everything on the ground, {destroying} other plants that would compete with the seeds for the water and sunlight needed for growth.","종종 모체 나무에 의해 시작되는 산불은 또한 땅 위의 거의 모든 것을 태워, 성장에 필요한 물과 햇빛을 두고 씨앗과 경쟁할 다른 식물들을 파괴한다."],
["As you can see, eucalyptus is only able to {reproduce} {provided that} there is fire.","보시다시피 유칼립투스는 불이 있어야만 번식할 수 있다."],
["Where {would you find} the tallest tree in the world?","세계에서 가장 큰 나무를 어디에서 찾을 수 있을까?"],
["You {will have to visit} Redwood National Park in the United States to find it.","그것을 찾으려면 미국의 레드우드 국립공원을 방문해야 할 것이다."]]},
{w:"redwood:레드우드(키 큰 침엽수)|typically:일반적으로|exceed:초과하다|enormously:엄청나게|reach:도달하다|record:기록|consider:고려하다|naturalist:자연학자|overwhelm:압도하다|myth:신화|odds:가능성|slim:희박한|slim to none:거의 없다|precise:정확한|potential:잠재적인|harm:피해|visitor:방문객|assume:추정하다|difference:차이|neighboring:이웃하는|merely:단지|impossible:불가능한|identify:식별하다|giant:거인",
s:[["Redwoods {are known} as the tallest plants in the world.","레드우드는 세상에서 가장 키 큰 식물로 알려져 있다."],
["{Typically}, redwoods grow over 60 m, and it is easy to find them exceeding 90 m.","일반적으로 레드우드는 60m 넘게 자라며, 90m를 초과하는 것을 찾기도 쉽다."],
["Among them, a redwood named Hyperion stands {enormously} tall, reaching over 115 m.","그중 하이페리온이라고 이름 붙여진 레드우드는 115m를 넘는, 엄청나게 큰 키로 서 있다."],
["It {holds} the record as the world's tallest tree.","그것은 세계에서 가장 키 큰 나무로서의 기록을 보유하고 있다."],
["Before it was discovered, Helios, which was 114 m, {was considered} to be the tallest tree.","그것이 발견되기 전에는 114m였던 헬리오스가 가장 키 큰 나무로 여겨졌다."],
["However, in 2006, two {naturalists} found a tree taller than Helios.","하지만 2006년에 두 명의 자연학자가 헬리오스보다 더 큰 나무를 찾았다."],
["They {were overwhelmed} by its height that they named it after one of the Titans from Greek myths, Hyperion.","그들은 그 높이에 압도되어 그리스 신화의 타이탄 중 한 명인 하이페리온의 이름을 따 이름 지었다."],
["Hyperion was the name of the Titan of the Sun, {meaning} the highest one.","하이페리온은 태양의 타이탄의 이름이었으며, '가장 높은 자'를 의미한다."],
["However, the {odds} of you seeing Hyperion at the park {are slim to none}.","하지만 공원에서 당신이 하이페리온을 볼 가능성은 거의 없다."],
["The park keeps its {precise} location a secret to protect it from {potential} harm caused by visitors.","공원은 방문객들로 인해 생길 수 있는 잠재적 피해로부터 그것을 보호하기 위해 정확한 위치를 비밀로 한다."],
["You may {assume} you can find it among the redwoods, but it is harder than you think.","당신은 레드우드들 사이에서 쉽게 찾을 수 있다고 추정할지 모르지만, 생각보다 더 어렵다."],
["The height {difference} between Hyperion and its neighboring redwoods is {merely} a few meters, making it nearly {impossible} to identify from the ground.","하이페리온과 주변 레드우드 사이의 높이 차이는 단지 몇 미터에 불과해서, 땅에서 식별하는 것을 거의 불가능하게 만든다."],
["Every redwood in the park will look like a {giant} from the bottom.","공원의 모든 레드우드는 아래에서 보면 거인처럼 보일 것이다."]]}
];
const $=s=>document.getElementById(s),app=$('app'),NAME={ek:'영→한',he:'한→영',cl:'빈칸 채우기',sc:'문장 배열'},CO=['ek','he','cl','sc'];
let sec=0,mode='',qs=[],i=0,sc=0,wr=[],course=0,done=[],lock=0,sel=[],tk=[],retry=0,R={};
try{done=JSON.parse(localStorage.getItem('d3')||'[]')}catch(e){}
try{R=JSON.parse(localStorage.getItem('r3')||'{}')}catch(e){}
const pct=n=>{let a=0,b=0;CO.forEach(m=>{if(R[n]&&R[n][m]){a+=R[n][m][0];b+=R[n][m][1]}});return b?Math.round(a/b*100):0};
const sum=n=>`<div class=c>${CO.filter(m=>R[n]&&R[n][m]).map(m=>`${NAME[m]} <b>${R[n][m][0]}/${R[n][m][1]}</b>`).join('<br>')}<br><b>총점 ${pct(n)}점</b></div>`;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const W=n=>D[n].w.split('|').map(x=>{const k=x.indexOf(':');return[x.slice(0,k),x.slice(k+1)]});
const plain=s=>s.replace(/[{}]/g,''),norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
function home(){mode='';app.innerHTML=`<h1>🌱 영어2 천재(조수경) 3과 · 일일 연습</h1><p class=s>하루에 한 섹션씩! 코스를 끝내면 ✓ 표시가 돼요.</p><div class=g>${D.map((d,n)=>`<button class="b ${n==sec?'on':''}" data-a=sec data-n=${n}>${n+1}번${R[n]?' '+pct(n)+'점':''}${done.includes(n)?' ✓':''}</button>`).join('')}</div><div class=c><b>3과 ${sec+1}번</b> · 단어 ${W(sec).length}개 · 문장 ${D[sec].s.length}개</div>${R[sec]?sum(sec):''}<button class="b on" data-a=course>▶ 오늘의 코스 (영한→한영→빈칸→배열)</button><button class=b data-a=go data-m=ek>영→한 단어테스트</button><button class=b data-a=go data-m=he>한→영 단어테스트</button><button class=b data-a=go data-m=cl>문장 빈칸 채우기</button><button class=b data-a=go data-m=sc>문장 배열 (unscramble)</button>`}
function start(m,c){retry=0;mode=m;course=c?1:0;i=0;sc=0;wr=[];const w=W(sec),s=D[sec].s;
if(m=='ek')qs=sh(w).map(x=>({q:x[0],a:x[1],o:sh([x[1],...sh(w.filter(y=>y[1]!=x[1])).slice(0,3).map(y=>y[1])])}));
if(m=='he')qs=sh(w).map(x=>({q:x[1],a:x[0],o:sh([x[0],...sh(w.filter(y=>y[0]!=x[0])).slice(0,3).map(y=>y[0])])}));
if(m=='cl'){const B=x=>(x[0].match(/\{[^}]*\}/g)||[]).map(y=>y.slice(1,-1)),P=[...new Set(D.flatMap(d=>d.s.flatMap(B)))],S=[...new Set(s.flatMap(B))];qs=[];
s.forEach(x=>B(x).forEach((a,n)=>{const wc=a.split(' ').length,f=y=>y!=a&&y.split(' ').length==wc;let d=[...new Set([...sh(S.filter(f)),...sh(P.filter(f)),...sh(P.filter(y=>y!=a))])].slice(0,4),c=-1;
qs.push({q:x[0].replace(/\{([^}]*)\}/g,(m,t)=>++c==n?'{_}':t),k:x[1],a,o:sh([a,...d])})}));qs=sh(qs)}
if(m=='sc')qs=sh(s).map(x=>({q:plain(x[0]),k:x[1]}));
show()}
function show(){lock=0;if(i>=qs.length)return end();const q=qs[i];
let h=`<div class=p><span>${sec+1}번 · ${NAME[mode]} ${i+1}/${qs.length}</span><span>✔ ${sc} <a data-a=hm style="cursor:pointer">🏠</a></span></div>`;
if(mode=='ek'||mode=='he')h+=`<div class=q>${q.q}</div>`+q.o.map((o,j)=>`<button class=b data-a=pick data-j=${j}>${o}</button>`).join('');
if(mode=='cl')h+=`<div class=k>${q.k}</div><div class=q>${q.q.replace('{_}','<u>&nbsp;&nbsp;&nbsp;?&nbsp;&nbsp;&nbsp;</u>')}</div>`+q.o.map((o,j)=>`<button class=b data-a=pick data-j=${j}>${'①②③④⑤'[j]} ${o}</button>`).join('');
if(mode=='sc'){tk=sh(q.q.split(' '));sel=[];h+=`<div class=k>${q.k}</div><div id=ans class=box></div><div id=pool class=box></div><button class="b on" data-a=chk>확인</button><button class=b data-a=rs>다시 놓기</button>`}
h+='<div id=f></div>';app.innerHTML=h;if(mode=='sc')drawSc();else{const x=app.querySelector('input');x&&x.focus()}}
function drawSc(){$('ans').innerHTML=sel.map(j=>`<span class=ch data-a=rm data-j=${j}>${tk[j]}</span>`).join('');$('pool').innerHTML=tk.map((w,j)=>sel.includes(j)?'':`<span class=ch data-a=ad data-j=${j}>${w}</span>`).join('')}
function fin(ok,ans){lock=1;if(ok)sc++;else wr.push(qs[i]);$('f').innerHTML=`<div class="r ${ok?'ok':'no'}">${ok?'⭕ 정답!':'❌ 정답: '+ans}</div><button class="b on" data-a=nx>다음 →</button>`}
function chk(){if(lock)return;const q=qs[i];let ok,ans;
if(mode=='he'){ans=q.a;ok=norm($('in').value)==norm(ans)}
if(mode=='cl'){const b=q.q.match(/\{[^}]*\}/g).map(x=>x.slice(1,-1)),v=[...app.querySelectorAll('.bl')];ok=b.every((x,n)=>norm(v[n].value)==norm(x));ans=b.join(' / ')}
if(mode=='sc'){ok=sel.map(j=>tk[j]).join(' ')==q.q;ans=q.q}
fin(ok,ans)}
function end(){const k=CO.indexOf(mode),last=course&&k==3,nxt=course&&k<3;
if(!retry){R[sec]=R[sec]||{};R[sec][mode]=[sc,qs.length];try{localStorage.setItem('r3',JSON.stringify(R))}catch(e){}}
if(last&&!done.includes(sec)){done.push(sec);try{localStorage.setItem('d3',JSON.stringify(done))}catch(e){}}
app.innerHTML=`<h2>${sec+1}번 ${NAME[mode]} 결과</h2><div class=q>${sc} / ${qs.length}${retry?' (다시 풀기)':''}</div>${wr.length?`<button class=b data-a=rt>틀린 ${wr.length}문제 다시 풀기</button>`:'<div class="r ok">🎉 모두 정답!</div>'}${nxt?`<button class="b on" data-a=nm>다음 단계: ${NAME[CO[k+1]]} →</button>`:''}${last?`<div class="r ok">🏆 ${sec+1}번 연습 완료!</div>`+sum(sec):''}<button class=b data-a=hm>처음으로</button>`}
app.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,j=+t.dataset.j;
if(a=='sec'){sec=+t.dataset.n;home()}else if(a=='go')start(t.dataset.m);else if(a=='course')start('ek',1);
else if(a=='hm')home();else if(a=='nx'){i++;show()}else if(a=='chk')chk();
else if(a=='nm')start(CO[CO.indexOf(mode)+1],1);
else if(a=='rt'){retry=1;qs=wr;wr=[];i=0;sc=0;show()}
else if(a=='pick'&&!lock){const q=qs[i];app.querySelectorAll('[data-a=pick]').forEach((b,n)=>{if(q.o[n]==q.a)b.classList.add('ok');else if(n==j)b.classList.add('no')});fin(q.o[j]==q.a,q.a)}
else if(a=='ad'&&!lock){sel.push(j);drawSc()}else if(a=='rm'&&!lock){sel=sel.filter(x=>x!=j);drawSc()}
else if(a=='rs'&&!lock){sel=[];drawSc()}};
app.onkeydown=e=>{if(e.key=='Enter'){const b=app.querySelector('[data-a=nx]')||app.querySelector('[data-a=chk]');b&&b.click()}};
home();
</script></body></html>
